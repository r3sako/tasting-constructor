{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}Новый кабинет — Конструктор дегустаций{% endblock %}
{% block body %}
<header class="topbar"><div class="inner">{{ m.brand() }}</div></header>
<main class="container"><div class="narrow stack">
  {{ m.flashes(flashes) }}
  <form class="card" method="post" action="/register">
    <h1>Кабинет организатора</h1>
    <div class="field" style="margin-top:16px"><label for="name">Имя или название площадки</label>
      <input id="name" type="text" name="name" value="{{ form.name or '' }}" maxlength="80" required></div>
    <div class="field"><label for="email">Почта</label>
      <input id="email" type="email" name="email" value="{{ form.email or '' }}" autocomplete="username" required></div>
    <div class="field"><label for="password">Пароль <span class="hint">не короче 8 символов</span></label>
      <input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required></div>
    <div class="field"><button class="btn btn-primary btn-block">Создать кабинет</button></div>
  </form>
  <p class="muted small">Уже есть кабинет? <a href="/login">Войти</a></p>
</div></main>
{% endblock %}
